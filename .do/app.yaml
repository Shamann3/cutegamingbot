name: cutegaming
region: ams

ingress:
  rules:
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /admin/api
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /health
    - component:
        name: frontend
      match:
        path:
          prefix: /

services:
  # ---------- FastAPI backend ----------
  - name: api
    github:
      repo: Shamann3/cutegamingbot
      branch: main
      deploy_on_push: true
    dockerfile_path: server/Dockerfile
    source_dir: /server
    http_port: 8080
    health_check:
      http_path: /health
    envs:
      - key: PRODUCTION
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: ALLOW_DEV_AUTH
        scope: RUN_AND_BUILD_TIME
        value: "false"
      # ВАЖНО: Новый кластер!
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: "postgresql://doadmin:AVNS_7x3v_3wF_zMebDkmOGe@db-pgsql-ams3-34361-aug-22-backup-do-user-18976217-0.d.db.ondigitalocean.com:25060/cutebase?sslmode=require"
      - key: DB_SSL
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: UVICORN_WORKERS
        scope: RUN_AND_BUILD_TIME
        value: "1"
      - key: REDIS_REQUIRED
        scope: RUN_AND_BUILD_TIME
        value: "false"
      - key: BOT_TOKEN
