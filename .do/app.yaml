  # ---------- Frontend (игра + админка) ----------
  - name: frontend
    github:
      repo: Shamann3/cutegamingbot
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    source_dir: /
    build_command: npm install && npm --prefix admin install && npm run build
    run_command: npm start
    http_port: 8080
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ""
      - key: VITE_ADMIN_API_PREFIX
        scope: BUILD_TIME
        value: "/admin/api"
      - key: HOST
        scope: RUN_AND_BUILD_TIME
        value: "0.0.0.0"
      - key: PORT
        scope: RUN_AND_BUILD_TIME
        value: "8080"

