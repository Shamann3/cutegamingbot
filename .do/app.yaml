# DigitalOcean App Platform  спецификация всего приложения.
# Применение: DO → твой App → Settings → App Spec → Edit → вставить этот файл → Save.
# Один домен, маршрутизация по путям:
#   /api, /admin/api, /health  → сервис api (FastAPI)
#   всё остальное (/, /panel/) → сервис frontend (игра + админка)
#
# ВАЖНО: значения-заглушки "REPLACE_ME" нужно заменить реальными в DO UI
# (Settings → компонент → Environment Variables). Токены лучше пометить как Encrypted.
name: cutegaming
region: ams

services:
  # ---------- FastAPI backend ----------
  - name: api
    github:
      repo: oleksandrfunded-beep/cutegaming
      branch: main
      deploy_on_push: true
    dockerfile_path: server/Dockerfile
    source_dir: /server
    http_port: 8080
    health_check:
      http_path: /health
    routes:
      # preserve_path_prefix: DO по умолчанию срезает префикс маршрута,
      # тогда FastAPI получает /farm/state вместо /api/farm/state → 404.
      - path: /api
        preserve_path_prefix: true
      - path: /admin/api
        preserve_path_prefix: true
      - path: /health
        preserve_path_prefix: true
    envs:
      - key: PRODUCTION
        value: "true"
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: DB_SSL
        value: "true"
      - key: UVICORN_WORKERS
        value: "1"
      - key: REDIS_REQUIRED
        value: "false"
      - key: BOT_TOKEN
        value: REPLACE_ME
      - key: ADMIN_BOT_TOKEN
        value: REPLACE_ME
      - key: SUPPORT_BOT_TOKEN
        value: REPLACE_ME
      - key: ADMIN_ENABLED
        value: "true"
      - key: ADMIN_USER_IDS
        value: REPLACE_ME
      - key: ADMIN_JWT_SECRET
        value: REPLACE_ME
      - key: ADMIN_LOGIN_KEY
        value: REPLACE_ME
      # URL узнаешь после первого деплоя потом впиши реальный https://...ondigitalocean.app
      - key: WEBAPP_URL
        value: REPLACE_ME
      - key: ADMIN_WEBAPP_URL
        value: REPLACE_ME
      - key: FRONTEND_ORIGIN
        value: REPLACE_ME
      - key: ADMIN_FRONTEND_ORIGIN
        value: REPLACE_ME

  # ---------- Frontend (игра + админка) ----------
  - name: frontend
    github:
      repo: oleksandrfunded-beep/cutegaming
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    source_dir: /
    # Два npm ci параллельно + без audit/fund — обычно минуты экономии на каждом деплое.
    # npm run build собирает игру и admin (см. package.json → "build").
    build_command: >
      (npm ci --no-audit --no-fund &
       npm --prefix admin ci --no-audit --no-fund &
       wait) && npm run build
    run_command: npm start
    http_port: 8080
    routes:
      - path: /
    envs:
      # Пусто = фронт ходит на тот же домен (/api, /admin/api) это и нужно при одном домене.
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ""
      - key: VITE_ADMIN_API_PREFIX
        scope: BUILD_TIME
        value: /admin/api

workers:
  # ---------- Telegram-боты (admin + support) ----------
  - name: bots
    github:
      repo: oleksandrfunded-beep/cutegaming
      branch: main
      deploy_on_push: true
    dockerfile_path: server/Dockerfile
    source_dir: /server
    run_command: python bots_runner.py
    # Ровно один инстанс: второй параллельный getUpdates = TelegramConflictError.
    instance_count: 1
    envs:
      - key: PRODUCTION
        value: "true"
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: DB_SSL
        value: "true"
      - key: REDIS_REQUIRED
        value: "false"
      # Пауза перед polling: старый worker успевает закрыть сессию после SIGTERM.
      - key: BOT_POLLING_START_DELAY
        value: "8"
      - key: BOT_TOKEN
        value: REPLACE_ME
      - key: ADMIN_BOT_TOKEN
        value: REPLACE_ME
      - key: SUPPORT_BOT_TOKEN
        value: REPLACE_ME
      - key: ADMIN_ENABLED
        value: "true"
      - key: ADMIN_USER_IDS
        value: REPLACE_ME
      - key: WEBAPP_URL
        value: REPLACE_ME

databases:
  - name: db
    engine: PG
    version: "16"
    production: false
