name: cutegaming
region: ams

services:
  # ---------- FastAPI backend ----------
  - name: api
    github:
      repo: Shamann3/cutegamingbot
      branch: main
      deploy_on_push: true
    dockerfile_path: server/Dockerfile
    source_dir: /server
    http_port: 8080
    health_check:
      http_path: /health
    routes:
      - path: /api
        preserve_path_prefix: true
      - path: /admin/api
        preserve_path_prefix: true
      - path: /health
        preserve_path_prefix: true
    envs:
      - key: PRODUCTION
        scope: RUN_AND_BUILD_TIME
        value: "true"
      - key: ALLOW_DEV_AUTH
        scope: RUN_AND_BUILD_TIME
        value: "false"
      - key: DATABASE_URL
