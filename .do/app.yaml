  # ---------- Frontend (игра + админка) ----------
  - name: frontend
    github:
      repo: Shamann3/cutegamingbot
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    source_dir: /
    build_command: npm install && npm --prefix admin install && npm run build
    run_command: npm start
    http_port: 8080
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ""
      - key: VITE_ADMIN_API_PREFIX
        scope: BUILD_TIME
        value: /admin/api

workers:
  # ---------- Telegram-боты (admin + support) ----------
  - name: bots
    github:
      repo: Shamann3/cutegamingbot
      branch: main
      deploy_on_push: true
    dockerfile_path: server/Dockerfile
    source_dir: /server
    run_command: python bots_runner.py
    instance_count: 1
    envs:
      - key: PRODUCTION
        scope: RUN_AND_BUILD_TIME
