<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cute Farming — Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      /* До CSS/React: phone только ios/android — иначе ПК (даже в узком Mini App). */
      (function () {
        try {
          var p = String((window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform) || '').toLowerCase()
          var phone = p === 'ios' || p === 'android' || p === 'android_x'
          var mode = 'desktop'
          if (phone) mode = 'phone'
          else if (!p && window.innerWidth < 901) mode = 'phone'
          document.documentElement.dataset.viewport = mode
          document.documentElement.classList.toggle('is-phone', mode === 'phone')
          document.documentElement.classList.toggle('is-desktop', mode === 'desktop')
          document.documentElement.dataset.tgDesktop = mode === 'desktop' ? '1' : '0'
        } catch (e) {
          document.documentElement.dataset.viewport = 'desktop'
          document.documentElement.classList.add('is-desktop')
          document.documentElement.dataset.tgDesktop = '1'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
