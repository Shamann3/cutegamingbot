<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Cute Farming — Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      /* До CSS/React: сразу phone|desktop, чтобы ПК не мигал телефонной вёрсткой */
      (function () {
        try {
          var p = String((window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform) || '').toLowerCase()
          var phone = p === 'ios' || p === 'android' || p === 'android_x'
          var deskPlat = p === 'tdesktop' || p === 'macos' || p === 'linux' || p === 'windows'
          var wide = window.innerWidth >= 901
          // web/weba на широком экране = ПК (web.telegram.org)
          var deskWeb = (p === 'web' || p === 'weba' || p === 'webk') && wide
          var mode = 'desktop'
          if (phone) mode = 'phone'
          else if (deskPlat || deskWeb || wide) mode = 'desktop'
          else mode = 'phone'
          document.documentElement.dataset.viewport = mode
          document.documentElement.classList.toggle('is-phone', mode === 'phone')
          document.documentElement.classList.toggle('is-desktop', mode === 'desktop')
        } catch (e) {
          document.documentElement.dataset.viewport = 'desktop'
          document.documentElement.classList.add('is-desktop')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
