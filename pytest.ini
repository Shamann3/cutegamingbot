[pytest]
# Собираем только test_*.py: файлы bench_*.py в tests/ - это ручные бенчмарки
# (им нужен Redis и аргумент командной строки), а не проверки поведения.
python_files = test_*.py

markers =
    redis: нужен живой Redis - pklcode биндится к нему из окружения
    db: нужна живая Postgres; включается переменной RUN_DB_TESTS=1
    slow: длительный прогон (soak-тесты, десятки секунд)
